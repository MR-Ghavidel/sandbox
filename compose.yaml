# Run the whole app locally with `docker compose up -d --build`, then open http://localhost:8000 (see INSTALL.md).
# The values below override .env inside the container.

services:
    app:
        build: .
        ports:
            - '8000:8000'
        environment:
            APP_URL: 'http://localhost:8000'
            APP_TIMEZONE: 'Asia/Tehran'
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: sandbox
            DB_USERNAME: sandbox
            DB_PASSWORD: secret
        volumes:
            - app-storage:/var/www/html/storage
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: 'mysql:8.4'
        environment:
            MYSQL_DATABASE: sandbox
            MYSQL_USER: sandbox
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        ports:
            - '3307:3306'
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-usandbox', '-psecret']
            interval: 5s
            timeout: 5s
            retries: 30

volumes:
    app-storage:
    mysql-data:
